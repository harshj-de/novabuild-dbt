version: 2

models:
  - name: dim_contractors
    columns:
      - name: contractor_id
        data_tests:
          - not_null
          - unique

  - name: fct_coi_verifications
    columns:
      - name: verification_id
        data_tests:
          - not_null
          - unique
      - name: contractor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contractors')
                field: contractor_id