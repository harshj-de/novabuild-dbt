version: 2

models:
  - name: stg_contractors
    columns:
      - name: contractor_id
        data_tests:
          - not_null
          - unique
      - name: tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['Preferred', 'Standard', 'Conditional', 'Probationary']
  - name: stg_projects
    columns: 
      - name: project_id
        data_tests:
          - not_null 
  - name: stg_claims
    columns: 
      - name: claim_id
        data_tests:
          - not_null 
  - name: stg_coi_verifications
    columns: 
      - name: verification_id
        data_tests:
          - not_null 
      - name: verification_result
        data_tests:
          - accepted_values:
              arguments:
                values: ['Compliant', 'Non-Compliant', 'Deficient', 'Pending Review']

  - name: stg_safety_incidents
    columns:
      - name: incident_id
        data_tests:
          - not_null
          - unique
      - name: contractor_id
        data_tests:
          - not_null